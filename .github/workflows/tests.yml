# Runs the unit tests on every push to main and on every pull request.
# The tests are fully offline (they use fake data), so no secrets/tokens are needed here.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # Download the repository code onto the runner.
      - uses: actions/checkout@v4
      # Install Python; `cache: pip` reuses downloaded packages between runs (faster).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Install the project's dependencies plus pytest (pytest is only needed for testing).
      - run: python -m pip install -r requirements.txt pytest
      # A failing test makes this step fail, which marks the commit/PR with a red X.
      - run: python -m pytest
